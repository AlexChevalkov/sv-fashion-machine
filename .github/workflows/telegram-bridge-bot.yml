name: Telegram Bridge Bot

# Approval bridge: sends pending items to Telegram with Да/Нет buttons and
# applies your taps back to Airtable. Driven by cron-job.org (every few minutes).
on:
  workflow_dispatch:

concurrency:
  group: telegram-bridge
  cancel-in-progress: false

jobs:
  telegram-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # boto3 — чтобы выложить на хостинг картинку, присланную в Телеграме
      # для обложки поста: ссылка Телеграма содержит токен бота и живёт
      # недолго, а продакшн-бот забирает фото позже, на своём прогоне.
      - name: Install dependencies
        run: pip install requests boto3

      - name: Run Telegram bridge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: Content Inbox
          AIRTABLE_VISUAL_TABLE_NAME: Visual Jobs
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: python telegram_bridge_bot.py
