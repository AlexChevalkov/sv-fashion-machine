name: Reel 05 Bot

on:
  workflow_dispatch:
  # Запуск по расписанию — во внешнем сервисе cron-job.org, как у остальных
  # ботов. Ветка экспериментальная: пока достаточно запускать реже прочих,
  # рилс собирается только когда карточке вручную поставлен статус "Reel 05".

# Рендер тяжёлый: один запуск за раз, новый ждёт предыдущего.
concurrency:
  group: reel05
  cancel-in-progress: false

jobs:
  reel05-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reel05/package-lock.json

      - name: Install Python dependencies
        run: pip install requests boto3

      - name: Install Remotion dependencies
        working-directory: reel05
        run: npm ci --no-audit --no-fund

      # Remotion рендерит в собственном headless-браузере. Ставим его заранее
      # отдельным шагом, чтобы падение загрузки было видно сразу, а не в
      # середине рендера.
      - name: Install Remotion browser
        working-directory: reel05
        run: npx remotion browser ensure

      - name: Run Reel 05 Bot
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_VISUAL_TABLE_NAME: Visual Jobs
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: "6a2481eac687a22dd46ad06c"
        run: python reel05_bot.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel05-outputs
          path: outputs/*
          if-no-files-found: warn
